name: spike-fetch-feasibility

# Throwaway spike workflow. Lives only on spike/fetch-feasibility; never merged.
on:
  push:
    branches: [spike/fetch-feasibility]
  workflow_dispatch:

permissions:
  contents: write  # spike only: commits results back to this branch

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spike/fetch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetch-results
          path: |
            spike/fetch/results.json
            spike/fetch/summary.md
      - name: Commit results to the spike branch
        if: always()
        run: |
          mkdir -p out && cp results.json summary.md out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out
          git commit -m "chore(spike): fetch results [skip ci]" || exit 0
          git push
